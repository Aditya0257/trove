# =============================================================================
#  application.yml — runtime configuration for the Trove backend
# =============================================================================
#
#  Purpose
#  -------
#  Wires the app to its two stateful dependencies (Postgres, S3/MinIO), selects
#  the extraction provider, sizes the async extraction executor, and seeds the
#  default dev identity. Everything sensitive is overridable by env var.
#
#  Business use case
#  -----------------
#  One config file works locally (docker-compose defaults below) and in prod (env
#  vars point the SAME code at Neon Postgres + Cloudflare R2). No code change to
#  switch environments — see DECISIONS.md → D1.
#
#  Solution architecture
#  ---------------------
#  - datasource  → Postgres (rebuildable index).
#  - jpa         → ddl-auto=validate: Flyway owns the schema, Hibernate only checks.
#  - trove.storage → S3 client settings (endpoint/keys/bucket); path-style for MinIO.
#  - trove.extraction → which ExtractionProvider bean is active (stub for now).
#  - trove.extraction.executor → the bounded async pool (DECISIONS.md → D3).
#  - trove.dev   → seeded user/space UUIDs used when no auth context exists (D6).
#
#  Reasoning & logic
#  -----------------
#  Defaults match infra/docker-compose.yml so `docker compose up` + run just works.
#  Secrets are literal only for local dev; in prod they come from env vars
#  (${VAR:default} syntax), honoring "secrets via env vars only."
# =============================================================================

spring:
  application:
    name: trove

  datasource:
    url: ${TROVE_DB_URL:jdbc:postgresql://localhost:5432/trove}
    username: ${TROVE_DB_USER:trove}
    password: ${TROVE_DB_PASSWORD:trove}

  jpa:
    hibernate:
      # Flyway is the single owner of the schema. Hibernate must never mutate it;
      # it only validates that the entities match the migrated tables.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      # Documents are photos/PDFs; allow reasonably large uploads.
      max-file-size: 25MB
      max-request-size: 30MB

server:
  port: ${SERVER_PORT:8080}

# ── Google OAuth (Drive backup leg) ──────────────────────────────────────────
google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/api/integrations/google-drive/callback}

# ── Trove-specific configuration ─────────────────────────────────────────────
trove:
  # Where the web app lives — used to bounce OAuth callbacks back into the UI. Dev is
  # ng-serve on 4200; set to the deployed web origin in prod.
  web:
    base-url: ${TROVE_WEB_BASE_URL:http://localhost:4200}

  ai:
    # Shared Cloudflare Workers AI free allowance (neurons/day) — the whole app draws on
    # one account, so this ceiling is global. Neurons (not tokens) are the billed unit.
    daily-neuron-limit: ${TROVE_AI_DAILY_NEURON_LIMIT:10000}
    # Per-user slice of that allowance. Caps any one user (default 20%) so a single heavy
    # uploader can't drain the day for everyone; over it, their uploads still file via the
    # free stub reader. Set 0-or-above; keep it below the global limit.
    per-user-neuron-limit: ${TROVE_AI_PER_USER_NEURON_LIMIT:2000}
    # Cloudflare's neuron price (USD per 1,000 neurons). Used to convert the models API's
    # USD-per-token pricing into neurons/token so the token→neuron rates auto-refresh.
    # Rarely changes; NeuronRateService falls back to baked-in rates if the fetch fails.
    neuron-usd-per-thousand: ${TROVE_AI_NEURON_USD_PER_K:0.011}

  storage:
    # S3-compatible endpoint. Local MinIO by default; set to the R2 endpoint in prod.
    endpoint: ${TROVE_S3_ENDPOINT:http://localhost:9000}
    region: ${TROVE_S3_REGION:us-east-1}
    access-key: ${TROVE_S3_ACCESS_KEY:minioadmin}
    secret-key: ${TROVE_S3_SECRET_KEY:minioadmin}
    bucket: ${TROVE_S3_BUCKET:trove}
    # MinIO needs path-style access (bucket in the path, not the hostname).
    # R2 also supports path-style, so true is safe for both.
    path-style-access: ${TROVE_S3_PATH_STYLE:true}
    # Create the bucket on startup if missing (dev convenience; harmless in prod).
    auto-create-bucket: ${TROVE_S3_AUTO_CREATE_BUCKET:true}
    # TTL for presigned view/download URLs handed to clients.
    presign-ttl-seconds: ${TROVE_S3_PRESIGN_TTL:900}

  mirror:
    # Independent second-cloud copy (e.g. Backblaze B2, which is S3-compatible).
    # Disabled until configured. B2 endpoint looks like https://s3.<region>.backblazeb2.com
    enabled: ${TROVE_MIRROR_ENABLED:false}
    endpoint: ${TROVE_MIRROR_ENDPOINT:}
    region: ${TROVE_MIRROR_REGION:us-east-1}
    access-key: ${TROVE_MIRROR_ACCESS_KEY:}
    secret-key: ${TROVE_MIRROR_SECRET_KEY:}
    bucket: ${TROVE_MIRROR_BUCKET:}
    path-style-access: ${TROVE_MIRROR_PATH_STYLE:true}
    sync-fixed-delay-ms: ${TROVE_MIRROR_SYNC_DELAY_MS:3600000}

  extraction:
    # WHICH PROVIDER READS DOCUMENTS.
    # The engine tries the `chain` steps in order and takes the first result whose
    # confidence >= acceptance-confidence. Available providers: cloudflare | gemini |
    # ollama | stub. Pick based on where you run:
    #
    #   • HOSTED / free      → cloudflare  (Cloudflare Workers AI; free daily quota,
    #                          nothing to self-host). RECOMMENDED for deployment.
    #   • LOCAL dev, free    → ollama      (runs on your machine; not usable from a
    #                          cloud host unless you also host Ollama).
    #   • gemini             → only if your Google account actually has free quota
    #                          (many new accounts get 0 — check ai.dev/rate-limit).
    #   • stub               → no real reading; canned output. The safety net so the
    #                          pipeline always completes. Keep it LAST in the chain.
    #
    # The default below is stub-only (works with zero setup). To enable real
    # extraction WITHOUT editing this file, set SPRING_APPLICATION_JSON, e.g. hosted:
    #   SPRING_APPLICATION_JSON='{"trove":{"extraction":{"acceptance-confidence":0.4,
    #     "chain":[{"provider":"cloudflare"},{"provider":"stub"}]}}}'
    chain:
      - provider: stub
    acceptance-confidence: ${TROVE_EXTRACTION_ACCEPT_CONF:0.0}
    breaker:
      # After N quota failures, skip that step for the cooldown (stop hammering an
      # exhausted free tier).
      failure-threshold: ${TROVE_EXTRACTION_BREAKER_FAILS:2}
      cooldown-seconds: ${TROVE_EXTRACTION_BREAKER_COOLDOWN:300}
    providers:
      # Cloudflare Workers AI — free + hosted. Get account id + an API token with the
      # "Workers AI" permission at dash.cloudflare.com.
      cloudflare:
        account-id: ${CF_ACCOUNT_ID:}
        api-token: ${CF_API_TOKEN:}
        # Llama 3.2 11B Vision reads real documents far better than llava-1.5-7b
        # (which hallucinates on receipts/bills). Both are free within the daily
        # Workers AI Neuron allowance; over-limit calls fall back to the stub.
        default-model: ${CF_MODEL:@cf/meta/llama-3.2-11b-vision-instruct}
        timeout-seconds: ${CF_TIMEOUT:60}
      # Google Gemini — free tier is 0 on some accounts; verify before relying on it.
      gemini:
        api-key: ${GEMINI_API_KEY:}
        endpoint: ${GEMINI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta}
        default-model: ${GEMINI_MODEL:gemini-2.0-flash}
        timeout-seconds: ${GEMINI_TIMEOUT:60}
      # Ollama — local only. Great for dev; for a cloud host you'd have to run Ollama
      # somewhere reachable. `ollama pull llava` (or moondream) first.
      ollama:
        endpoint: ${OLLAMA_ENDPOINT:http://localhost:11434}
        default-model: ${OLLAMA_MODEL:llava}
        timeout-seconds: ${OLLAMA_TIMEOUT:120}
    executor:
      # Bounded async pool for extraction (DECISIONS.md → D3). CallerRunsPolicy
      # applies backpressure instead of dropping work or exhausting memory.
      core-pool-size: ${TROVE_EXTRACTION_CORE_POOL:2}
      max-pool-size: ${TROVE_EXTRACTION_MAX_POOL:4}
      queue-capacity: ${TROVE_EXTRACTION_QUEUE:100}
    reconciler:
      # Periodic sweep that re-dispatches documents left un-extracted (crash safety).
      fixed-delay-ms: ${TROVE_EXTRACTION_RECONCILE_DELAY_MS:300000}   # 5 min

  reminder:
    # How often the scheduler scans for due reminders and dispatches them.
    scan-fixed-delay-ms: ${TROVE_REMINDER_SCAN_DELAY_MS:3600000}   # 1h
    # Legacy single lead time (kept for back-compat; lead-days-list supersedes it).
    lead-days: ${TROVE_REMINDER_LEAD_DAYS:3}
    # Days-before-due to fire reminders: a week ahead, the day before, and the day
    # itself. Override with a comma list, e.g. TROVE_REMINDER_LEAD_DAYS_LIST=14,7,1,0
    lead-days-list: ${TROVE_REMINDER_LEAD_DAYS_LIST:7,1,0}

  # Outbound email for reminders. Blank api-key => email is skipped (reminders still
  # fire in-app + as phone notifications). Brevo's free tier (300/day) needs no domain,
  # only a verified sender address.
  email:
    api-key: ${TROVE_EMAIL_API_KEY:}
    from-email: ${TROVE_EMAIL_FROM:}
    from-name: ${TROVE_EMAIL_FROM_NAME:Trove}

  ingest:
    # Shared secret gating the email/WhatsApp ingestion webhooks. Set via env in prod.
    enabled: ${TROVE_INGEST_ENABLED:true}
    secret: ${TROVE_INGEST_SECRET:dev-ingest-secret}

  anomaly:
    # Flag a bill when it exceeds the trailing category average by this fraction.
    threshold-pct: ${TROVE_ANOMALY_THRESHOLD:0.40}
    # Months of confirmed history to average over.
    lookback-months: ${TROVE_ANOMALY_LOOKBACK_MONTHS:12}
    # Minimum prior confirmed samples before we judge (avoids false alarms).
    min-samples: ${TROVE_ANOMALY_MIN_SAMPLES:3}

  security:
    jwt:
      # HMAC-SHA256 signing secret (>= 32 bytes). MUST be overridden in prod via env.
      secret: ${TROVE_JWT_SECRET:dev-only-change-me-please-32bytes-minimum-secret}
      expiration-minutes: ${TROVE_JWT_EXPIRATION_MINUTES:720}
    # Passphrase for encryption at rest (Drive refresh tokens; vital docs later).
    # Any string; a 256-bit AES key is derived from it. MUST be set via env in prod.
    encryption-key: ${TROVE_ENCRYPTION_KEY:dev-only-change-me-encryption-passphrase}

  drive:
    # How often the Drive sync job runs (only touches spaces with a connected Drive).
    sync-fixed-delay-ms: ${TROVE_DRIVE_SYNC_DELAY_MS:3600000}   # 1h
    scheduled-sync-enabled: ${TROVE_DRIVE_SCHEDULED_SYNC:true}

  dev:
    # Seeded identity (Flyway V6). Used to provision a usable dev login for testing.
    default-user-id: ${TROVE_DEV_USER_ID:00000000-0000-0000-0000-000000000001}
    default-space-id: ${TROVE_DEV_SPACE_ID:00000000-0000-0000-0000-000000000010}
    # If set, the seeded dev user gets this password on first startup (local testing
    # only). Blank disables the dev login — leave blank in production.
    default-password: ${TROVE_DEV_PASSWORD:devpassword}

logging:
  level:
    com.trove: ${TROVE_LOG_LEVEL:INFO}
